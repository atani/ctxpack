name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    name: Build and attach distributions
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Build sdist and wheel
        run: uv build
      - name: Attach distributions to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*

  build-msi:
    name: Build MSI installer
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Build standalone executable
        shell: pwsh
        run: |
          uv venv
          uv pip install pyinstaller .
          .venv\Scripts\pyinstaller.exe --onefile --console `
            --name ctxpack build/windows/ctxpack_entry.py
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 4.0.6
      - name: Build MSI
        shell: pwsh
        run: |
          $Version = "${{ needs.release-please.outputs.tag_name }}".TrimStart('v')
          wix build build/windows/ctxpack.wxs `
            -arch x64 `
            -d Version=$Version `
            -d ExeSource=dist/ctxpack.exe `
            -o ctxpack-windows-x64.msi
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" ctxpack-windows-x64.msi

  publish-homebrew:
    name: Update Homebrew formula
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Check for tap token
        id: check
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping formula update." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: steps.check.outputs.skip != 'true'
        with:
          repository: atani/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Generate formula
        if: steps.check.outputs.skip != 'true'
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          TARBALL="https://github.com/atani/ctxpack/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL "$TARBALL" | sha256sum | cut -d' ' -f1)
          cat > homebrew-tap/Formula/ctxpack.rb << FORMULA
          class Ctxpack < Formula
            include Language::Python::Virtualenv

            desc "Token-aware context extraction for AI agents"
            homepage "https://github.com/atani/ctxpack"
            url "${TARBALL}"
            sha256 "${SHA}"
            license "MIT"
            head "https://github.com/atani/ctxpack.git", branch: "main"

            depends_on "python@3.13"

            def install
              virtualenv_install_with_resources
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ctxpack --version")
            end
          end
          FORMULA
      - name: Commit and push formula
        if: steps.check.outputs.skip != 'true'
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ctxpack.rb
          git diff --staged --quiet || git commit -m "Update ctxpack to ${{ needs.release-please.outputs.tag_name }}"
          git push

  publish-winget:
    name: Publish to winget
    needs: [release-please, build-msi]
    # Enable by setting the repository variable ENABLE_WINGET=true once the
    # WINGET_TOKEN secret and a fork of microsoft/winget-pkgs are in place.
    if: ${{ needs.release-please.outputs.release_created && vars.ENABLE_WINGET == 'true' }}
    runs-on: ubuntu-latest
    # The submission acts on the winget-pkgs fork via WINGET_TOKEN, so this job
    # needs no write access to GITHUB_TOKEN on this repository.
    permissions:
      contents: read
    steps:
      - name: Compute version
        id: ver
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Submit MSI to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: atani.ctxpack
          version: ${{ steps.ver.outputs.version }}
          release-tag: ${{ needs.release-please.outputs.tag_name }}
          installers-regex: '\.msi$'
          fork-user: atani
          token: ${{ secrets.WINGET_TOKEN }}
