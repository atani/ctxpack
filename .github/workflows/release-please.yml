name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    name: Build and attach distributions
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Build sdist and wheel
        run: uv build
      - name: Attach distributions to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*

  publish-homebrew:
    name: Update Homebrew formula
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Check for tap token
        id: check
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping formula update." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.check.outputs.skip != 'true'
        with:
          repository: atani/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Generate formula
        if: steps.check.outputs.skip != 'true'
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          TARBALL="https://github.com/atani/ctxpack/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL "$TARBALL" | sha256sum | cut -d' ' -f1)
          cat > homebrew-tap/Formula/ctxpack.rb << FORMULA
          class Ctxpack < Formula
            include Language::Python::Virtualenv

            desc "Token-aware context extraction for AI agents"
            homepage "https://github.com/atani/ctxpack"
            url "${TARBALL}"
            sha256 "${SHA}"
            license "MIT"
            head "https://github.com/atani/ctxpack.git", branch: "main"

            depends_on "python@3.13"

            def install
              virtualenv_install_with_resources
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ctxpack --version")
            end
          end
          FORMULA
      - name: Commit and push formula
        if: steps.check.outputs.skip != 'true'
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ctxpack.rb
          git diff --staged --quiet || git commit -m "Update ctxpack to ${{ needs.release-please.outputs.tag_name }}"
          git push
