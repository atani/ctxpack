name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    name: Build and attach distributions
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22.x"
          cache: true
      - name: Build release binaries
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="ctxpack_${VERSION}_${os}_${arch}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${name}/ctxpack${ext}" ./cmd/ctxpack
            cp README.md LICENSE "dist/${name}/"
            (cd "dist/${name}" && python3 -m zipfile -c "../${name}.zip" .)
            rm -rf "dist/${name}"
          done
          (cd dist && sha256sum *.zip > checksums.txt)
      - name: Generate winget manifests
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "dist/winget/atani/ctxpack/${VERSION}"
          URL="https://github.com/atani/ctxpack/releases/download/${TAG}/ctxpack_${VERSION}_windows_amd64.zip"
          SHA=$(sha256sum "dist/ctxpack_${VERSION}_windows_amd64.zip" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s#__INSTALLER_URL__#${URL}#g" \
            -e "s/__INSTALLER_SHA256__/${SHA}/g" \
            packaging/winget/ctxpack.installer.yaml.template > "dist/winget/atani/ctxpack/${VERSION}/atani.ctxpack.installer.yaml"
          sed -e "s/__VERSION__/${VERSION}/g" packaging/winget/ctxpack.locale.en-US.yaml.template > "dist/winget/atani/ctxpack/${VERSION}/atani.ctxpack.locale.en-US.yaml"
          sed -e "s/__VERSION__/${VERSION}/g" packaging/winget/ctxpack.yaml.template > "dist/winget/atani/ctxpack/${VERSION}/atani.ctxpack.yaml"
          (cd dist/winget && python3 -m zipfile -c ../ctxpack_${VERSION}_winget_manifests.zip .)
      - name: Attach distributions to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.zip dist/checksums.txt

  publish-homebrew:
    name: Update Homebrew formula
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Check for tap token
        id: check
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping formula update." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: steps.check.outputs.skip != 'true'
        with:
          repository: atani/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Generate formula
        if: steps.check.outputs.skip != 'true'
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          TARBALL="https://github.com/atani/ctxpack/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL "$TARBALL" | sha256sum | cut -d' ' -f1)
          cat > homebrew-tap/Formula/ctxpack.rb << FORMULA
          class Ctxpack < Formula
            desc "Token-aware context extraction for AI agents"
            homepage "https://github.com/atani/ctxpack"
            url "${TARBALL}"
            sha256 "${SHA}"
            license "MIT"
            head "https://github.com/atani/ctxpack.git", branch: "main"

            depends_on "go" => :build

            def install
              system "go", "build", *std_go_args(ldflags: "-s -w -X main.version=#{version}"), "./cmd/ctxpack"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ctxpack --version")
            end
          end
          FORMULA
      - name: Commit and push formula
        if: steps.check.outputs.skip != 'true'
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ctxpack.rb
          git diff --staged --quiet || git commit -m "Update ctxpack to ${{ needs.release-please.outputs.tag_name }}"
          git push
